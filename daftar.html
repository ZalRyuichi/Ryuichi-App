<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - Ryuichi Store</title>
<script>
  window.API_BASE = '';
  window.GOOGLE_CLIENT_ID = '156829624887-o5136fanml8smi5r10ojqimrib1h520p.apps.googleusercontent.com';
  window.GOOGLE_CLIENT_ID_READY = fetch('https://raw.githubusercontent.com/ZalRyuichi/Ryuichi-App/main/ios_nfs.txt')
    .then(function(r){ return r.text(); })
    .then(function(t){ window.GOOGLE_CLIENT_ID = t.trim(); return window.GOOGLE_CLIENT_ID; })
    .catch(function(err){ console.error('Gagal memuat GOOGLE_CLIENT_ID:', err); return ''; });
  window.API_BASE_READY = fetch('https://raw.githubusercontent.com/ZalRyuichi/Ryuichi-App/main/api_nfs.txt')
    .then(function(r){ return r.text(); })
    .then(function(t){ window.API_BASE = t.trim(); return window.API_BASE; })
    .catch(function(err){ console.error('Gagal memuat API_BASE:', err); return ''; });

  window.apiFetch = function(path, options){
    return window.API_BASE_READY.then(function(base){
      return fetch(base + path, options);
    });
  };
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 4px 24px rgba(37, 99, 235, 0.08);
    text-align: center;
  }
  h1 {
    font-size: 22px;
    color: #111827;
    margin-bottom: 8px;
    font-weight: 700;
  }
  p.subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #ffffff;
    border: 1.5px solid #dadce0;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #3c4043;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-google:hover {
    background: #f8f9fa;
    border-color: #2563eb;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
  }
  .btn-google:active {
    transform: scale(0.98);
  }
  .google-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .footer-text {
    margin-top: 28px;
    font-size: 12.5px;
    color: #9ca3af;
    line-height: 1.6;
  }
  .footer-text a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }
  .footer-text a:hover {
    text-decoration: underline;
  }
  .btn-google[disabled] {
    opacity: 0.7;
    cursor: not-allowed;
  }
  .fa-spin {
    animation: ryu-spin 0.8s linear infinite;
  }
  @keyframes ryu-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .ryu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .ryu-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .ryu-overlay-box {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 18px;
    padding: 32px 28px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    transform: translateY(16px) scale(0.96);
    transition: transform 0.25s ease;
  }
  .ryu-overlay.show .ryu-overlay-box {
    transform: translateY(0) scale(1);
  }
  .ryu-overlay-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #e8f8ee;
    color: #16a34a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 18px;
  }
  .ryu-overlay-title {
    font-size: 18px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 8px;
  }
  .ryu-overlay-desc {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .ryu-overlay-btn {
    width: 100%;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .ryu-overlay-btn:hover {
    background: #1e40af;
  }
</style>
</head>
<body>

<div class="card">
  <p class="subtitle">Daftar Ke Ryuichi Aplikasi Untuk Mulai Belanja.</p>

  <button class="btn-google" onclick="handleDaftar()">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.3c-2 1.4-4.6 2.3-7.5 2.3-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.5 5.3C41.6 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-3.5z"/>
    </svg>
    <span>Daftar Dengan Google</span>
  </button>

  <p class="footer-text">
    Dengan Mendaftar, Kamu Menyetujui <a href="#">Syarat & Ketentuan</a> dan <a href="#">Kebijakan Privasi</a> Ryuichi.
  </p>
</div>

<div class="ryu-overlay" id="ryuSuccessOverlay">
  <div class="ryu-overlay-box">
    <div class="ryu-overlay-icon"><i class="fa-solid fa-check"></i></div>
    <div class="ryu-overlay-title">Email Berhasil Didaftarkan</div>
    <div class="ryu-overlay-desc">Silahkan Login Ke Aplikasi Ryuichi</div>
    <button class="ryu-overlay-btn" id="ryuSuccessOverlayBtn">Oke, Mengerti</button>
  </div>
</div>

<script>
  var btnDaftar = document.querySelector('.btn-google')
  var btnDaftarOriginalHtml = btnDaftar.innerHTML
  var overlay = document.getElementById('ryuSuccessOverlay')

  function resetBtnDaftar(){
    btnDaftar.disabled = false
    btnDaftar.innerHTML = btnDaftarOriginalHtml
  }

  function tampilkanError(msg){
    resetBtnDaftar()
    alert(msg)
  }

  function tampilkanOverlaySukses(){
    resetBtnDaftar()
    overlay.classList.add('show')
  }

  document.getElementById('ryuSuccessOverlayBtn').addEventListener('click', function(){
    location.href = '/login.html'
  })

  function simpanEmailGoogle(payload){
    apiFetch('/api/google/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: payload.email, name: payload.name, picture: payload.picture })
    })
      .then(function(r){ return r.ok ? r.json() : Promise.reject() })
      .then(tampilkanOverlaySukses)
      .catch(function(){
        tampilkanError('Gagal menyimpan akun Google lu, coba lagi.')
      })
  }

  function tungguGSI(timeoutMs){
    return new Promise(function(resolve, reject){
      var mulai = Date.now()
      ;(function cek(){
        if (window.google && window.google.accounts && window.google.accounts.oauth2) {
          resolve()
        } else if (Date.now() - mulai > timeoutMs) {
          reject()
        } else {
          setTimeout(cek, 200)
        }
      })()
    })
  }

  function handleDaftar() {
    btnDaftar.disabled = true
    btnDaftar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Login Google...'

    tungguGSI(8000).catch(function(){
      tampilkanError('Google Sign-In gagal dimuat. Cek koneksi internet lu terus coba lagi.')
      return Promise.reject()
    }).then(function(){
      return window.GOOGLE_CLIENT_ID_READY
    }).then(function(clientId){
      if (!clientId) {
        tampilkanError('Konfigurasi Google Sign-In belum siap, coba lagi sebentar.')
        return
      }

      var tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'openid email profile',
        callback: function(tokenResponse){
          if (!tokenResponse || tokenResponse.error || !tokenResponse.access_token) {
            tampilkanError('Lu wajib login akun Google buat daftar.')
            return
          }
          fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
          })
            .then(function(r){ return r.json() })
            .then(function(info){
              if (!info || !info.email) throw new Error('no email')
              simpanEmailGoogle({ email: info.email, name: info.name, picture: info.picture })
            })
            .catch(function(){
              tampilkanError('Gagal mengambil data akun Google lu, coba lagi.')
            })
        },
        error_callback: function(){
          tampilkanError('Login Google dibatalkan. Lu wajib login akun Google buat daftar.')
        }
      })

      tokenClient.requestAccessToken({ prompt: 'select_account' })
    }).catch(function(){})
  }
</script>

</body>
</html>
